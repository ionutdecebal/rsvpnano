# RSVP Nano localization source.
# Edit this file, then run localization/generate_localization.py.
schema_version = 1
default_language = "English"
ascii_only = false
language_order = [
	"English",
	"Spanish",
	"French",
	"German",
	"Romanian",
	"Polish",
	"Russian",
	"Hebrew",
	"Arabic",
	"Japanese",
	"Korean",
	"ChineseSimplified",
	"ChineseTraditional",
]

# Add ui_font = { source = "localization/fonts/<locale>.u8g2", license = "..." }
# to a language only when the compiled UI font does not cover it. CJK locales use
# Fusion Pixel Font's 10px proportional regional builds; generation emits the
# translated UI and native locale-name glyphs.
# Hebrew uses ui_font = { source = "third_party/able-font/Able5.ttf",
# pixel_size = 8, license = "Able license; credit Joseph Fatula" }.
# Arabic uses ui_font = { source = "third_party/pixel-ae/PixelAE-Regular.ttf",
# pixel_size = 10, shaping_source = "third_party/pixel-ae/PixelAE-Regular.ttf",
# license = "CC0-1.0; credit Ahmed Essam" }. Generation shapes the logical
# translations here before deriving the U8g2 subset.
# Reader capability is installed independently through RFont4 files under /fonts.

[languages.English]
code = "en"
name = "English"
scripts = ["Latn"]
direction = "ltr"
translation_status = "reviewed"

[languages.Spanish]
code = "es"
name = "Español"
scripts = ["Latn"]
direction = "ltr"
translation_status = "preview"

[languages.French]
code = "fr"
name = "Français"
scripts = ["Latn"]
direction = "ltr"
translation_status = "preview"

[languages.German]
code = "de"
name = "Deutsch"
scripts = ["Latn"]
direction = "ltr"
translation_status = "preview"

[languages.Romanian]
code = "ro"
name = "Română"
scripts = ["Latn"]
direction = "ltr"
translation_status = "preview"

[languages.Polish]
code = "pl"
name = "Polski"
scripts = ["Latn"]
direction = "ltr"
translation_status = "preview"

[languages.Russian]
code = "ru"
name = "Русский"
scripts = ["Cyrl"]
direction = "ltr"
translation_status = "preview"

[languages.Hebrew]
code = "he"
name = "עברית"
scripts = ["Hebr"]
direction = "rtl"
translation_status = "preview"
ui_font = { source = "third_party/able-font/Able5.ttf", pixel_size = 8, license = "Able license; credit Joseph Fatula" }

[languages.Arabic]
code = "ar"
name = "العربية"
scripts = ["Arab"]
direction = "rtl"
translation_status = "preview"
ui_font = { source = "third_party/pixel-ae/PixelAE-Regular.ttf", pixel_size = 10, shaping_source = "third_party/pixel-ae/PixelAE-Regular.ttf", license = "CC0-1.0; credit Ahmed Essam" }

[languages.Japanese]
code = "ja"
name = "日本語"
scripts = ["Hani", "Hira", "Kana"]
direction = "ltr"
translation_status = "preview"
ui_font = { source = "third_party/fusion-pixel-font/10px-proportional/fusion-pixel-10px-proportional-ja.bdf", license = "OFL-1.1; credit TakWolf and upstream contributors" }

[languages.Korean]
code = "ko"
name = "한국어"
scripts = ["Hang"]
direction = "ltr"
translation_status = "preview"
ui_font = { source = "third_party/fusion-pixel-font/10px-proportional/fusion-pixel-10px-proportional-ko.bdf", license = "OFL-1.1; credit TakWolf and upstream contributors" }

[languages.ChineseSimplified]
code = "zh-Hans"
name = "简体中文"
scripts = ["Hani"]
direction = "ltr"
translation_status = "preview"
ui_font = { source = "third_party/fusion-pixel-font/10px-proportional/fusion-pixel-10px-proportional-zh_hans.bdf", license = "OFL-1.1; credit TakWolf and upstream contributors" }

[languages.ChineseTraditional]
code = "zh-Hant"
name = "繁體中文"
scripts = ["Hani"]
direction = "ltr"
translation_status = "preview"
ui_font = { source = "third_party/fusion-pixel-font/10px-proportional/fusion-pixel-10px-proportional-zh_hant.bdf", license = "OFL-1.1; credit TakWolf and upstream contributors" }

