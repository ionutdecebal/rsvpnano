[[strings]]
key = "StorageEncryptionExplanation"
context = "Explanation that the NVS partition is encrypted with a device-only key."
English = "Uses a device-only key. Copied NVS settings cannot be read elsewhere."
Spanish = "Usa una clave del dispositivo. Las copias de NVS no se pueden leer en otro lugar."
French = "Utilise une clé propre à l'appareil. Les copies NVS sont illisibles ailleurs."
German = "Nutzt einen Geräteschlüssel. Kopierte NVS-Daten sind anderswo nicht lesbar."
Romanian = "Folosește o cheie a dispozitivului. Copiile NVS nu pot fi citite în altă parte."
Polish = "Używa klucza urządzenia. Kopii NVS nie można odczytać gdzie indziej."
Russian = "Использует ключ устройства. Копию NVS нельзя прочитать на другом устройстве."
Hebrew = "מפתח ייחודי למכשיר. הגדרות NVS שהועתקו לא ייקראו במקום אחר."
Arabic = "مفتاح خاص بالجهاز. لا تقرأ إعدادات NVS المنسوخة على جهاز آخر."
Japanese = "端末専用鍵を使用。コピーしたNVS設定は他で読めません。"
Korean = "기기 전용 키 사용. 복사한 NVS 설정은 다른 기기에서 읽을 수 없습니다."
ChineseSimplified = "使用设备专用密钥。复制的NVS设置无法在其他设备读取。"
ChineseTraditional = "使用裝置專用金鑰。複製的NVS設定無法在其他裝置讀取。"

[[strings]]
key = "StorageEncryptionPermanent"
context = "Warning that enabling encryption permanently burns an eFuse and requires encrypted NVS firmware."
English = "Permanent: burns a hardware fuse, erases NVS, and requires encryption-aware firmware."
Spanish = "Permanente: quema un eFuse, borra NVS y exige firmware compatible con cifrado."
French = "Permanent : grave un eFuse, efface la NVS et exige un firmware compatible."
German = "Dauerhaft: Brennt eine eFuse, löscht NVS und erfordert passende Firmware."
Romanian = "Permanent: arde un eFuse, șterge NVS și necesită firmware compatibil."
Polish = "Trwale: wypala eFuse, kasuje NVS i wymaga zgodnego oprogramowania."
Russian = "Навсегда: прожигает eFuse, стирает NVS и требует совместимую прошивку."
Hebrew = "קבוע: צורב נתיך, מוחק NVS ודורש קושחה תומכת הצפנה."
Arabic = "دائم: يحرق مصهرا ويمسح NVS ويتطلب نظاما يدعم التشفير."
Japanese = "恒久的にヒューズを焼き、NVSを消去。暗号対応ファームが必要です。"
Korean = "영구적: 퓨즈 소각, NVS 삭제, 암호화 지원 펌웨어가 필요합니다."
ChineseSimplified = "永久操作：熔断硬件保险丝、清除NVS，并需加密固件。"
ChineseTraditional = "永久操作：熔斷硬體保險絲、清除NVS，且需加密韌體。"

[[strings]]
key = "StorageEncryptionReset"
context = "Warning that SD-backed settings return after restart but the Wi-Fi password must be entered again."
English = "SD settings return after restart. The Wi-Fi password must be entered again."
Spanish = "Los ajustes SD vuelven al reiniciar. Debes introducir otra vez la contraseña Wi-Fi."
French = "Les réglages SD reviennent au redémarrage. Le mot de passe Wi-Fi doit être ressaisi."
German = "SD-Einstellungen kehren nach Neustart zurück. Das WLAN-Passwort muss neu eingegeben werden."
Romanian = "Setările SD revin după repornire. Parola Wi-Fi trebuie introdusă din nou."
Polish = "Ustawienia SD wrócą po restarcie. Hasło Wi-Fi trzeba wpisać ponownie."
Russian = "Настройки SD вернутся после перезапуска. Пароль Wi-Fi нужно ввести снова."
Hebrew = "לאחר הפעלה מחדש הגדרות SD חוזרות. יש להזין שוב סיסמת Wi-Fi."
Arabic = "تعود إعدادات SD بعد إعادة التشغيل. أدخل كلمة مرور Wi-Fi مجددا."
Japanese = "再起動後にSD設定は戻ります。Wi-Fiパスワードは再入力してください。"
Korean = "재시작 후 SD 설정은 복원됩니다. Wi-Fi 비밀번호는 다시 입력하세요."
ChineseSimplified = "重启后SD设置恢复。需重新输入Wi-Fi密码。"
