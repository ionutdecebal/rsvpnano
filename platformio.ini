;
; Native unit tests
;
[env:native_test]
platform = native
framework =
lib_deps =
  https://github.com/stephenberry/glaze.git#v7.9.1
lib_ignore =
  GFX Library for Arduino
  XPowersLib
  glaze
test_framework = unity
test_filter =
  test_companion_serial
  test_epub_conversion
  test_pdf_conversion
  test_feed_parser
  test_focus
  test_fonts
  test_locales
  test_pacing
  test_release_parser
  test_reaction_screensaver
  test_theme
  test_settings
  test_axs15231b_touch
  test_ui
test_build_src = yes

build_src_filter =
  -<*>
  +<conversion/epub/EpubContentParser.cpp>
  +<conversion/rsvp/RsvpWriter.cpp>
  +<conversion/pdf/PdfTextExtractor.cpp>
  +<storage/fs/BufferedWriter.cpp>
  +<companion/serial/CompanionSerialProtocol.cpp>
  +<conversion/epub/EpubPackage.cpp>
  +<feeds/FeedParser.cpp>
  +<text/RsvpTokenizer.cpp>
  +<text/LocaleTag.cpp>
  +<text/BidiText.cpp>
  +<text/TextShaping.cpp>
  +<text/TextNormalizer.cpp>
  +<ui/Theme.cpp>
  +<localization/LocalePack.cpp>
  +<settings/SettingsCodec.cpp>
  +<focus/FocusTimers.cpp>
  +<focus/FocusSession.cpp>
  +<reader/ReadingLoop.cpp>
  +<screensavers/PackedGrid.cpp>
  +<screensavers/LifeGrid.cpp>
  +<screensavers/LifeScreensaver.cpp>
  +<screensavers/MazeScreensaver.cpp>
  +<screensavers/ReactionScreensaver.cpp>
  +<screensavers/Screensavers.cpp>
  +<screensavers/VoronoiScreensaver.cpp>
  +<update/ReleaseParser.cpp>
  +<ui/Ui.cpp>
  +<ui/Controls.cpp>
  +<ui/screens/regular/PacingSettingsScreen.cpp>
  +<ui/screens/PageReaderScreen.cpp>
  +<ui/screens/regular/ReadingSettingsScreen.cpp>
  +<ui/screens/regular/ScreenCommon.cpp>
  +<ui/screens/regular/ReaderLayout.cpp>
  +<ui/Localization.generated.cpp>
  +<ui/Keyboard.cpp>
  +<ui/Icons.cpp>
  +<drivers/touch/axs15231b_touch/axs15231b_touch.cpp>

build_flags =
  -DGLZ_DEFAULT_OPTIMIZATION_SIZE
  -DGLZ_DISABLE_ALWAYS_INLINE
  -std=gnu++23
  -Itest/support
  -Isrc
  -lz

[env:native_watch_test]
extends = env:native_test
test_filter = test_watch_ui
build_src_filter =
  ${env:native_test.build_src_filter}
  -<ui/screens/regular/**>
  +<ui/screens/watch/ScreenCommon.cpp>
  +<ui/screens/watch/ReaderLayout.cpp>
  +<ui/screens/watch/ReadScreen.cpp>
  +<ui/screens/watch/SettingsScreen.cpp>
  +<ui/screens/watch/ReadingSettingsScreen.cpp>
  +<ui/screens/watch/PacingSettingsScreen.cpp>
  +<ui/screens/watch/ReaderSettingsScreen.cpp>
  +<ui/screens/watch/DeviceScreen.cpp>
  +<ui/screens/watch/ChaptersScreen.cpp>
  +<ui/screens/watch/StatusScreen.cpp>
  +<ui/screens/watch/OtaScreen.cpp>
