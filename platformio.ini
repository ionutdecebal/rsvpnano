[env:benchmark_waveshare_esp32s3_touch_lcd_349_rev1]
extends = env:waveshare_esp32s3_touch_lcd_349_rev1

build_src_filter =
  ${env:waveshare_esp32s3_touch_lcd_349_rev1.build_src_filter}
  ${common.benchmark_src_filter}

build_flags =
  ${env:waveshare_esp32s3_touch_lcd_349_rev1.build_flags}
  ${common.benchmark_build_flags}

monitor_filters =
  ${common.benchmark_monitor_filters}

