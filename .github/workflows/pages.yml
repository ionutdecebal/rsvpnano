name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'companion/apps/web/**'
      - 'companion/shared/**'
      - 'companion/conversion/**'
      - 'companion/build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - 'kotlin-js-store/wasm/**'
      - 'tools/fetch_release_firmware.py'
      - 'tools/export_web_firmware.py'
      - 'tools/package_release.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download latest release firmware
        if: github.repository == 'ionutdecebal/rsvpnano'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RSVP_UI_PREVIEW_TAG: ${{ vars.RSVP_UI_PREVIEW_TAG }}
        run: python tools/fetch_release_firmware.py --repo "${{ github.repository }}"

      - name: Check and stage web companion
        run: bash ./gradlew checkWeb --no-daemon

      - name: Configure GitHub Pages
        if: github.repository == 'ionutdecebal/rsvpnano'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.repository == 'ionutdecebal/rsvpnano'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/webSite

  deploy:
    if: github.repository == 'ionutdecebal/rsvpnano' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
