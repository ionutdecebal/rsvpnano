name: Release firmware

# New UI releases must use the scoped candidate build and deliberate publication.
# In particular, pushing v0.2.0 must not trigger the Classic multi-board release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-release-only:
    runs-on: ubuntu-latest
    steps:
      - name: Use the reviewed New UI publication process
        run: |
          echo 'Use New UI candidate; publish tested artifacts after device acceptance.'
          exit 1
