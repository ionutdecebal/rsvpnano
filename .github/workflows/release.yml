name: Release firmware

on:
  push:
    tags:
      - "v0.0.*"
      - "v0.1.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.0.9"
        required: true
      draft:
        description: "Upload a draft release for verification before publication"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set release metadata
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="$DISPATCH_VERSION"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if ! echo "$RELEASE_TAG" | grep -Eq '^v0\.[01]\.[0-9]+$'; then
            echo "::error::Invalid release version: ${RELEASE_TAG}"
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify pushed release tag
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          BUILD_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          git fetch --tags origin
          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [ "$TAG_SHA" != "$BUILD_SHA" ]; then
            echo "::error::${RELEASE_TAG} points at ${TAG_SHA}, not ${BUILD_SHA}."
            exit 1
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/firmware-build.yml
    with:
      firmware_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: firmware-assets
          path: build/firmware

      - name: Load release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          NOTES_PATH="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$NOTES_PATH" ]; then
            echo "::error::Missing release notes: ${NOTES_PATH}"
            exit 1
          fi
          cp "$NOTES_PATH" release-notes.md

      - name: Prepare update catalog descriptor and checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          if [ -f src/update/SwitchSettings.cpp ]; then
            python3 tools/make_update_descriptor.py \
              --image build/firmware/rsvp-nano-esp32-s3-touch-lcd-3.49-ota.bin \
              --channel classic --tag "$RELEASE_TAG" --commit "$BUILD_SHA" \
              --output build/firmware/update-channel.json
          fi
          python3 tools/package_release.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_SHA: ${{ needs.prepare.outputs.commit_sha }}
          CREATE_DRAFT: ${{ inputs.draft || false }}
        run: |
          # Published tags and assets are immutable. Reuse never deletes a release.
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$BUILD_SHA"
          else
            git tag "$RELEASE_TAG" "$BUILD_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'; exit 1
          fi
          python3 tools/package_release.py --print-assets > build/publish-assets.txt
          mapfile -t assets < build/publish-assets.txt
          test "${#assets[@]}" -gt 0
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft --latest=false \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file release-notes.md --target "$BUILD_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > build/release-response.json
          python3 tools/check_legacy_ota_metadata.py build/release-response.json
          if [ "$CREATE_DRAFT" != "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
