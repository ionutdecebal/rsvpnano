name: New UI candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Unique preview-ui-dictionary-* or v0.2.x tag (build only)"
        required: true
      board:
        description: "LCD 3.49 hardware revision"
        type: choice
        default: lcd349-v1
        options:
          - lcd349-v1
          - lcd349-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate candidate tag
        env:
          CANDIDATE_TAG: ${{ inputs.version }}
        run: |
          if ! [[ "$CANDIDATE_TAG" =~ ^preview-ui-dictionary-[A-Za-z0-9._-]+$ || "$CANDIDATE_TAG" =~ ^v0\.2\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo 'Invalid candidate tag'; exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$CANDIDATE_TAG"; then
            test "$(git rev-list -n 1 "$CANDIDATE_TAG")" = "$(git rev-parse HEAD)"
          else
            git tag "$CANDIDATE_TAG"
          fi
      - name: Install build tools
        run: pip install platformio
      - name: Select hardware revision
        env:
          CANDIDATE_BOARD: ${{ inputs.board }}
        run: |
          case "$CANDIDATE_BOARD" in
            lcd349-v1)
              echo 'FIRMWARE_ENV=waveshare_esp32s3_touch_lcd_349_rev1' >> "$GITHUB_ENV"
              echo 'OTA_ASSET=rsvp-nano-esp32-s3-touch-lcd-3.49-ota.bin' >> "$GITHUB_ENV" ;;
            lcd349-v2)
              echo 'FIRMWARE_ENV=waveshare_esp32s3_touch_lcd_349_rev2' >> "$GITHUB_ENV"
              echo 'OTA_ASSET=rsvp-nano-esp32-s3-touch-lcd-3.49-rev2-ota.bin' >> "$GITHUB_ENV" ;;
            *) echo 'Unsupported candidate board'; exit 1 ;;
          esac
      - name: Build selected LCD 3.49 revision
        env:
          RSVP_FIRMWARE_TAG: ${{ inputs.version }}
        run: python3 tools/export_web_firmware.py --env "$FIRMWARE_ENV"
      - name: Record update descriptor
        env:
          CANDIDATE_TAG: ${{ inputs.version }}
          CANDIDATE_BOARD: ${{ inputs.board }}
        run: |
          python3 tools/make_update_descriptor.py \
            --image "build/firmware/$OTA_ASSET" --board "$CANDIDATE_BOARD" \
            --channel new-ui --tag "$CANDIDATE_TAG" --commit "$(git rev-parse HEAD)" \
            --output build/firmware/update-channel.json
      - name: Record checksums
        working-directory: build/firmware
        run: sha256sum *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: new-ui-candidate-${{ inputs.board }}
          path: build/firmware
          if-no-files-found: error
      # Publication is a separate, deliberate step after reviewing and testing
      # the downloaded binaries. This workflow never moves remote tags or
      # overwrites assets, and never touches the Classic stable release.
